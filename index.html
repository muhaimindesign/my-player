
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UEFA Live Player</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: #050d20;
    color: white;
    font-family: Arial, sans-serif;
    min-height: 100vh;
}

header {
    padding: 20px 4%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: #07152e;
    border-bottom: 1px solid #123b78;
}

.logo {
    font-size: 27px;
    font-weight: bold;
}

.logo span {
    color: #078cff;
}

.live {
    color: #00e676;
    font-size: 14px;
}

.container {
    width: 96%;
    max-width: 1500px;
    margin: 25px auto;
}

.player {
    width: 100%;
    background: #000;
    border: 1px solid #087cff;
    border-radius: 12px;
    overflow: hidden;
    position: relative;
    aspect-ratio: 16 / 9;
}

video {
    width: 100%;
    height: 100%;
    display: block;
    background: #000;
    object-fit: contain;
}

.overlay {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    background: rgba(0,0,0,0.45);
    text-align: center;
    padding: 20px;
    pointer-events: none;
}

.overlay h2 {
    font-size: 30px;
    margin-bottom: 10px;
}

.overlay p {
    color: #ccc;
    font-size: 15px;
}

footer {
    text-align: center;
    padding: 20px;
    color: #9aabc8;
    border-top: 1px solid #123b78;
    margin-top: 25px;
}

@media(max-width:600px) {
    header {
        padding: 16px;
    }

    .logo {
        font-size: 20px;
    }

    .container {
        width: 100%;
        margin: 15px auto;
    }

    .player {
        border-radius: 0;
    }

    .overlay h2 {
        font-size: 20px;
    }
}
</style>
</head>

<body>

<header>
    <div class="logo">UEFA <span>PLAYER</span></div>
    <div class="live">● LIVE STREAMING</div>
</header>

<div class="container">

    <div class="player">

        <video id="video"
               controls
               autoplay
               playsinline
               preload="metadata">
        </video>

        <div class="overlay" id="overlay">
            <h2>UEFA PLAYER</h2>
            <p id="status">Loading Stream...</p>
        </div>

    </div>

</div>

<footer>
    Powered by GitHub Pages
</footer>

<script>

const video = document.getElementById("video");
const overlay = document.getElementById("overlay");
const statusText = document.getElementById("status");

// Read stream URL from ?x=
const params = new URLSearchParams(window.location.search);
const streamUrl = params.get("x");

let hls;

function showStatus(message) {
    overlay.style.display = "flex";
    statusText.textContent = message;
}

function startPlayer() {

    if (!streamUrl) {
        showStatus("No Stream URL Provided");
        return;
    }

    if (Hls.isSupported()) {

        hls = new Hls();

        hls.loadSource(streamUrl);
        hls.attachMedia(video);

        hls.on(Hls.Events.MANIFEST_PARSED, function() {
            overlay.style.display = "none";
            video.play().catch(() => {
                showStatus("Press Play to Start");
            });
        });

        hls.on(Hls.Events.ERROR, function(event, data) {
            if (data.fatal) {
                showStatus("Unable to Load Stream");
            }
        });

    } else if (video.canPlayType("application/vnd.apple.mpegurl")) {

        video.src = streamUrl;

        video.addEventListener("loadedmetadata", function() {
            overlay.style.display = "none";
            video.play().catch(() => {
                showStatus("Press Play to Start");
            });
        });

        video.addEventListener("error", function() {
            showStatus("Stream Could Not Be Loaded");
        });

    } else {
        showStatus("HLS Not Supported");
    }
}

startPlayer();

</script>

</body>
</html>
